version: '3.8'

services:
  autofarm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autofarm-game
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=autofarm
      - DB_PASSWORD=autofarm_secret
      - DB_NAME=autofarm_db
      - JWT_SECRET=production_jwt_secret_replace_me_random_32_chars
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: autofarm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=autofarm
      - POSTGRES_PASSWORD=autofarm_secret
      - POSTGRES_DB=autofarm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autofarm -d autofarm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
